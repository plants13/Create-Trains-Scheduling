plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    // Create, Ponder and Flywheel development artifacts
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven { url = "https://mvn.devos.one/snapshots" }
    // DragonLib (CRN's hard dependency)
    maven { url = "https://maven.mrjulsen.net" }
    // Create Railways Navigator (hard dependency)
    maven { url = "https://api.modrinth.com/maven" }
    // DragonLib 的传递依赖：Architectury API / ForgeConfigAPIPort
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // 开发期自检：JSON <-> Schedule 往返 + 信号 mixin 注入点验证
            jvmArguments.addAll '-Dcts.selftest=true', '-Dcts.verifyMixin=true'
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create and its own dependencies (development artifacts)
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create Railways Navigator (hard dependency) + its DragonLib dependency
    implementation("de.mrjulsen.mcdragonlib:dragonlib-neoforge:1.21.1-beta-3.0.28")
    implementation("maven.modrinth:create-railways-navigator:rlsRwxq3")

    // 注意：Xaero 集成不在编译期依赖 Xaero 的类（其 xaero.lib 是 jar-in-jar 嵌套 jar），
    // 而是用 mixin 的字符串 targets + 访问器接口，见 mixin/xaero 与 client/XaeroOverlay。
}

// Expand the version/mod properties in neoforge.mods.toml
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
