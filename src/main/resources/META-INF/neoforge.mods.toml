# Mod metadata for Create: Trains Scheduling.
# Placeholders are expanded by the ProcessResources task (see build.gradle).

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,)"
ordering="AFTER"
side="BOTH"

# Create Railways Navigator 是硬依赖：铁路主题服务器基本必装，我们复用它的旅程/时刻/延误数据
[[dependencies.${mod_id}]]
modId="createrailwaysnavigator"
type="required"
versionRange="[0.10.0-C6,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="create_trains_scheduling.mixins.json"

[[mixins]]
config="create_trains_scheduling.xaero.mixins.json"

# 可选客户端集成：Xaero 世界地图 / JourneyMap（未安装时对应叠加层不加载）
[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="optional"
versionRange="[1,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="journeymap"
type="optional"
versionRange="[1,)"
ordering="NONE"
side="CLIENT"

# 注意：Steam 'n' Rails 不在这里声明为依赖。
# 多站进路的"途经不停车"是在运行时检测 railways:waypoint_destination 指令是否存在，
# 声明 optional 依赖反而会触发版本范围检查（SnR 版本号是 0.3.0-beta.x），所以不声明。