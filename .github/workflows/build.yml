name: Build

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # runData 带 -Dcts.selftest=true -Dcts.verifyMixin=true：
      # JSON <-> Schedule 往返自检 + 信号 mixin 注入点校验。
      # 日志里必须出现 PASS 且不能出现 FAIL / InjectionError，否则判定失败。
      - name: Run data generation with self-tests
        run: |
          set -o pipefail
          ./gradlew runData --console=plain 2>&1 | tee selftest.log
          if grep -E '\[CTS selftest\].*(FAIL|CRASHED)' selftest.log; then
            echo "::error::selftest reported FAIL or CRASHED"; exit 1
          fi
          if grep -E 'InjectionError|Mixin apply failed' selftest.log; then
            echo "::error::mixin injection failed"; exit 1
          fi
          if ! grep -E '\[CTS selftest\].*PASS' selftest.log; then
            echo "::error::no selftest PASS line found"; exit 1
          fi

      - name: Upload selftest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-log-${{ github.sha }}
          path: selftest.log
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Rename jar with commit id
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          mod_id=$(sed -n 's/^mod_id=//p' gradle.properties)
          ver=$(sed -n 's/^mod_version=//p' gradle.properties)
          # 把 commit id 插到版本核心号之后、构建元数据之前：
          # 0.0.10a-alpha-1.21.1Neo-C6 -> 0.0.10a+6328c2f-alpha-1.21.1Neo-C6
          core="${ver%%-*}"
          if [ "$core" != "$ver" ]; then
            rest="-${ver#*-}"
          else
            rest=""
          fi
          new_name="${mod_id}-${core}+${sha}${rest}.jar"
          src="build/libs/${mod_id}-${ver}.jar"
          mv "$src" "build/libs/${new_name}"
          echo "renamed: $(basename "$src") -> ${new_name}"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
